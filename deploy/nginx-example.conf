# Пример конфига nginx для sheduler.yar.21-school.ru
# Приложение слушает порт 4001 — nginx проксирует на него.
# В .env приложения: TRUSTED_PROXY_HOPS=1 (nginx — единственный прокси), APP_BIND_ADDRESS=127.0.0.1.
#
# Файл подключается в контексте http {} (например, /etc/nginx/conf.d/scheduler.conf),
# поэтому директивы limit_req_zone ниже допустимы на верхнем уровне файла.

server_tokens off;

# ---------------------------------------------------------------------------
# Rate limiting (общий для всех реплик приложения).
# Лимиты внутри приложения (300 запросов/мин на IP для /api, 60/мин для /api/auth/*,
# загрузки аватара) считаются в памяти КАЖДОГО процесса отдельно; лимиты неудачных входов
# (по IP и по учётной записи) хранятся в БД и общие для реплик. nginx даёт общий лимит запросов.
# ---------------------------------------------------------------------------
# Вход: 10 запросов/мин с IP (+ всплеск 5) — перебор паролей упирается в nginx раньше приложения
limit_req_zone $binary_remote_addr zone=sched_login:10m rate=10r/m;
# Прочие auth-эндпоинты (регистрация, сброс пароля, проверка инвайта)
limit_req_zone $binary_remote_addr zone=sched_auth:10m rate=30r/m;
# Загрузки (аватар, файлы справки)
limit_req_zone $binary_remote_addr zone=sched_upload:10m rate=10r/m;
# Весь API: 10 запросов/с (+ всплеск 100) — UI делает много параллельных запросов
limit_req_zone $binary_remote_addr zone=sched_api:10m rate=10r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=sched_conn:10m;

server {
    listen 80;
    server_name sheduler.yar.21-school.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name sheduler.yar.21-school.ru;

    # SSL-сертификаты (настроить коллеге)
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Аватары до 5 МБ, файлы справки до 20 МБ; медиа справки (до 50 МБ) — в location загрузки ниже
    client_max_body_size 20m;
    client_body_timeout 30s;
    proxy_read_timeout 120s;
    limit_conn sched_conn 50;

    # Общие заголовки проксирования (повторяются в каждом location: proxy_set_header не наследуется,
    # если в location есть свой proxy_set_header)

    location = /api/auth/login {
        limit_req zone=sched_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        limit_req zone=sched_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/user/avatar {
        limit_req zone=sched_upload burst=5 nodelay;
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/admin/help/upload {
        limit_req zone=sched_upload burst=10 nodelay;
        client_max_body_size 52m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=sched_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # IP клиента: перезаписываем (не дописываем) — клиент не может подставить свой X-Forwarded-For
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
